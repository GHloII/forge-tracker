name: forge-tracker

services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      DATA_DIR: /data
      BOOTSTRAP_USER: ${BOOTSTRAP_USER:-owner}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD in .env}
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      COOKIE_SECURE: "true"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError
    volumes:
      - tracker_data:/data
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  tracker_data:

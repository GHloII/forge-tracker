name: Verify and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test bootJar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/reports/tests/test
      - name: Build runtime image from verified JAR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/forge-runtime
          cp deploy/Dockerfile /tmp/forge-runtime/Dockerfile
          cp build/libs/forge-tracker-1.0.0.jar /tmp/forge-runtime/app.jar
          docker build --tag forge-tracker:${{ github.sha }} /tmp/forge-runtime
          docker save forge-tracker:${{ github.sha }} | gzip -1 > /tmp/forge-image.tar.gz
      - name: Deploy and check public HTTPS
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/forge
          chmod 600 ~/.ssh/forge
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          checksum=$(sha256sum /tmp/forge-image.tar.gz | cut -d' ' -f1)
          ssh -i ~/.ssh/forge -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 "deploy@$DEPLOY_HOST" "deploy $GITHUB_SHA $checksum" < /tmp/forge-image.tar.gz
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors "$PUBLIC_URL/actuator/health"
